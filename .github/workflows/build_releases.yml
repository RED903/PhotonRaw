name: Build Native Releases (Android, Windows, macOS, iOS)

on:
  push:
    tags:
      - 'v*' # v1.0.0 같은 버전 태그를 푸시하면 4대 네이티브 바이너리 빌드 시작
  workflow_dispatch: # GitHub 웹사이트에서 버튼 클릭으로도 수동 빌드 가능

permissions:
  contents: write

jobs:
  # 1. 안드로이드 APK 빌드
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotonRaw-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # 2. Windows 실행 파일 빌드
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Compress Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath PhotonRaw-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotonRaw-Windows
          path: PhotonRaw-Windows-x64.zip

  # 3. macOS 앱 빌드
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS (Release)
        run: flutter build macos --release

      - name: Compress macOS Build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../PhotonRaw-macOS.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotonRaw-macOS
          path: PhotonRaw-macOS.zip

  # 4. iOS IPA (사이드로딩/AltStore/Sideloadly용) 빌드
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/*.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r ../../../PhotonRaw-iOS.ipa Payload
          cd ../../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotonRaw-iOS
          path: PhotonRaw-iOS.ipa

  # 5. GitHub Release 생성 및 4대 네이티브 파일 자동 업로드
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhotonRaw-Android-APK
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhotonRaw-Windows
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhotonRaw-macOS
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhotonRaw-iOS
          path: release-assets

      - name: Rename Android APK
        run: |
          if [ -f release-assets/app-release.apk ]; then
            mv release-assets/app-release.apk release-assets/PhotonRaw-Android.apk
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
